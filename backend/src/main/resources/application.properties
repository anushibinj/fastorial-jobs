spring.application.name=jobs

# Cloud Run injects PORT
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fastorial_jobs}
spring.datasource.username=${DB_USER:fastorial}
spring.datasource.password=${DB_PASSWORD:fastorial}

# Small pool: Cloud Run runs many instances against one database
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Jobs
jobs.default-expiry-days=30
jobs.max-page-size=50
jobs.default-page-size=20

# Secrets (empty means the protected endpoints reject every call)
app.admin.token=${ADMIN_TOKEN:}
app.internal.secret=${CLEANUP_SECRET:}

# CORS (comma separated origins). The browser calls the backend directly, so set this to the frontend origin(s).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
springdoc.swagger-ui.enabled=true
