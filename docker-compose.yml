services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fastorial_jobs
      POSTGRES_USER: fastorial
      POSTGRES_PASSWORD: fastorial
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastorial -d fastorial_jobs"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Full stack for local use: docker compose --profile full up --build
  # The Next.js app serves the pages and the API, and migrates the database when it starts.
  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    environment:
      PORT: "3000"
      DB_URL: jdbc:postgresql://postgres:5432/fastorial_jobs
      DB_USER: fastorial
      DB_PASSWORD: fastorial
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin}
      CLEANUP_SECRET: ${CLEANUP_SECRET:-dev-secret}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
