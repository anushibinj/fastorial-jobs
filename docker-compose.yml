services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fastorial_jobs
      POSTGRES_USER: fastorial
      POSTGRES_PASSWORD: fastorial
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastorial -d fastorial_jobs"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Full stack for local use: docker compose --profile full up --build
  backend:
    profiles: ["full"]
    build: ./backend
    environment:
      PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/fastorial_jobs
      DB_USER: fastorial
      DB_PASSWORD: fastorial
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin}
      CLEANUP_SECRET: ${CLEANUP_SECRET:-dev-secret}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
        API_BASE_URL: http://backend:8080
    environment:
      PORT: "3000"
      API_BASE_URL: http://backend:8080
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
