name: Deploy backend

# Backend only (Cloud Run). The frontend deploys itself through Firebase App Hosting on every push to the live branch.
# Manual by default. Uncomment the push trigger to deploy every merge to main.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

env:
  PROJECT: ${{ vars.GCP_PROJECT }}
  REGION: ${{ vars.GCP_REGION || 'asia-south1' }}
  REPO: fastorial-jobs                   # Artifact Registry repository

permissions:
  contents: read
  id-token: write                        # Workload Identity Federation

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Docker login to Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          REG="$REGION-docker.pkg.dev/$PROJECT/$REPO"
          echo "BACKEND_IMAGE=$REG/backend:$GITHUB_SHA" >> "$GITHUB_ENV"
          docker build -t "$REG/backend:$GITHUB_SHA" backend
          docker push "$REG/backend:$GITHUB_SHA"

      - name: Deploy backend
        env:
          DB_URL: ${{ vars.DB_URL }}
          DB_USER: ${{ vars.DB_USER }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          BACKEND_MIN_INSTANCES: ${{ vars.BACKEND_MIN_INSTANCES || '0' }}
        run: |
          envsubst < deploy/backend.service.yaml > /tmp/backend.yaml
          gcloud run services replace /tmp/backend.yaml --project "$PROJECT" --region "$REGION"
          gcloud run services add-iam-policy-binding fastorial-jobs-backend --project "$PROJECT" --region "$REGION" \
            --member=allUsers --role=roles/run.invoker >/dev/null
