# Firebase App Hosting settings for the Next.js frontend (backendId "fastorial-jobs", see ../firebase.json).
# Reference: https://firebase.google.com/docs/app-hosting/configure
runConfig:
  minInstances: 0
  maxInstances: 5
  cpu: 1
  memoryMiB: 512

env:
  # Public origin of this site (canonical URLs, share links, sitemap). Inlined at build time.
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://jobs.fastorial.dev
    availability:
      - BUILD

  # Public origin of the backend. The browser calls it directly, so the backend must list the site
  # origin in CORS_ALLOWED_ORIGINS. Inlined at build time, so redeploy the frontend if it changes.
  # TODO: replace with the deployed backend URL (Cloud Run URL or custom domain).
  - variable: NEXT_PUBLIC_API_URL
    value: https://fastorial-jobs-backend-spring-boot-97819677558.asia-southeast1.run.app
    availability:
      - BUILD
      - RUNTIME

  # Must equal the backend ADMIN_TOKEN. Create it with: firebase apphosting:secrets:set fastorial-admin-token
  - variable: ADMIN_TOKEN
    secret: fastorial-admin-token
    availability:
      - RUNTIME
