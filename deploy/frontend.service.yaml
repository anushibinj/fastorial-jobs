# gcloud run services replace deploy/frontend.service.yaml  (after envsubst, see docs/deploy.md)
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: fastorial-jobs-frontend
  labels:
    cloud.googleapis.com/location: ${REGION}
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "${FRONTEND_MIN_INSTANCES}"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 30
      containers:
        - image: ${FRONTEND_IMAGE}
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - { name: API_BASE_URL, value: "${API_BASE_URL}" }
            - name: ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: fastorial-admin-token, key: latest } }
          startupProbe:
            httpGet: { path: /offline, port: 8080 }
            periodSeconds: 2
            failureThreshold: 20
          livenessProbe:
            httpGet: { path: /offline, port: 8080 }
            periodSeconds: 30
            timeoutSeconds: 3
