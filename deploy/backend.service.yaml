# gcloud run services replace deploy/backend.service.yaml  (after envsubst, see docs/deploy.md)
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: fastorial-jobs-backend
  labels:
    cloud.googleapis.com/location: ${REGION}
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "${BACKEND_MIN_INSTANCES}"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/startup-cpu-boost: "true"   # faster JVM start
    spec:
      containerConcurrency: 80
      timeoutSeconds: 30
      containers:
        - image: ${BACKEND_IMAGE}
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 768Mi
          env:
            - { name: DB_URL, value: "${DB_URL}" }
            - { name: DB_USER, value: "${DB_USER}" }
            - { name: DB_POOL_SIZE, value: "5" }
            - { name: CORS_ALLOWED_ORIGINS, value: "${CORS_ALLOWED_ORIGINS}" }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: fastorial-db-password, key: latest } }
            - name: ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: fastorial-admin-token, key: latest } }
            - name: CLEANUP_SECRET
              valueFrom: { secretKeyRef: { name: fastorial-cleanup-secret, key: latest } }
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 20
            timeoutSeconds: 3
